name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-15-intel, rid: osx-x64 } # macos-13 is retired; this is the current Intel runner
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      # The ARM64 Windows image may not ship clang; this gives build-sqlite.sh cl as a fallback.
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.rid == 'win-arm64'
        with:
          arch: arm64

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build SQLite for static linking
        run: echo "SQLITE_OBJ=$(bash .github/scripts/build-sqlite.sh native)" >> "$GITHUB_ENV"

      - name: Publish (Native AOT)
        run: >
          dotnet publish src/Getcmd.Cli -c Release -r ${{ matrix.rid }}
          -p:PublishAot=true -p:Version="$VERSION" -p:SqliteStaticObject="$SQLITE_OBJ"
          -o publish

      - name: Package
        run: |
          mkdir -p dist
          case "${{ matrix.rid }}" in
            win-*)
              (cd publish && 7z a -tzip "../dist/getcmd-$VERSION-${{ matrix.rid }}.zip" getcmd.exe)
              ;;
            *)
              tar -C publish -czf "dist/getcmd-$VERSION-${{ matrix.rid }}.tar.gz" getcmd
              ;;
          esac
          ls -l publish dist

      - name: Smoke test the packaged binary
        run: |
          mkdir -p smoke
          case "${{ matrix.rid }}" in
            win-*) 7z x -osmoke "dist/getcmd-$VERSION-${{ matrix.rid }}.zip" && bash .github/scripts/smoke.sh smoke/getcmd.exe ;;
            *) tar -C smoke -xzf "dist/getcmd-$VERSION-${{ matrix.rid }}.tar.gz" && bash .github/scripts/smoke.sh smoke/getcmd ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: getcmd-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  # Alpine and other musl systems need their own build. Native AOT must be
  # compiled on musl, so this runs inside the Alpine SDK image.
  build-musl:
    name: linux-musl-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish (Native AOT) in the Alpine SDK image
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e VERSION mcr.microsoft.com/dotnet/sdk:10.0-alpine sh -c '
            set -eu
            apk add --no-cache bash clang build-base zlib-dev curl unzip > /dev/null
            obj=$(bash .github/scripts/build-sqlite.sh native)
            dotnet publish src/Getcmd.Cli -c Release -r linux-musl-x64 \
              -p:PublishAot=true -p:Version="$VERSION" -p:SqliteStaticObject="$obj" -o publish
            mkdir -p dist
            tar -C publish -czf "dist/getcmd-$VERSION-linux-musl-x64.tar.gz" getcmd
            mkdir -p smoke && tar -C smoke -xzf "dist/getcmd-$VERSION-linux-musl-x64.tar.gz"
            bash .github/scripts/smoke.sh smoke/getcmd
          '
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: getcmd-linux-musl-x64
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [build, build-musl]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Version from tag
        id: version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Homebrew formula
        run: |
          mkdir -p formula
          bash .github/scripts/homebrew-formula.sh "$VERSION" dist/SHA256SUMS > formula/getcmd.rb
          cat formula/getcmd.rb

      # Pushes the formula to getCMD-com/homebrew-tap when the token is configured.
      - name: Publish to the Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping the tap update"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/getCMD-com/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp formula/getcmd.rb tap/Formula/getcmd.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/getcmd.rb
          if git diff --cached --quiet; then
            echo "formula unchanged"
          else
            git commit -m "getcmd v$VERSION"
            git push
          fi

  # Installs the release that was just published, the way a user would.
  install-test:
    name: install.sh on ${{ matrix.image }}
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "alpine:3.20"]
    steps:
      - uses: actions/checkout@v5

      - run: bash .github/scripts/install-test.sh "${{ matrix.image }}"
        env:
          GETCMD_VERSION: ${{ needs.release.outputs.version }}
